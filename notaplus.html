<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NotaPlus — Cours particuliers</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0d1628;--navy2:#151f35;--blue:#1e7fd9;--sky:#4db8e8;
  --yellow:#f5c518;--gold:#e8a800;--teal:#1d9e75;--coral:#D85A30;
  --purple:#8B5CF6;--white:#fff;--border:rgba(255,255,255,0.08);
}
html,body{min-height:100vh;font-family:'Nunito',sans-serif;background:var(--navy);color:#fff;overflow-x:hidden}

/* ===== SCREENS ===== */
.screen{display:none;min-height:100vh}
.screen.active{display:flex;flex-direction:column}

/* ===== LOGIN ===== */
#sc-login{background:linear-gradient(135deg,#060f1f,#1a2d5a);justify-content:center;align-items:center;position:relative;overflow:hidden}
.login-stars{position:absolute;inset:0;pointer-events:none}
.lstar{position:absolute;border-radius:50%;background:var(--yellow);animation:twinkle 2s infinite alternate}
@keyframes twinkle{0%{opacity:.1}100%{opacity:.8}}
.login-box{position:relative;z-index:2;width:100%;max-width:420px;padding:20px}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo-icon{font-size:60px;display:block;animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.login-logo h1{font-family:'Poppins',sans-serif;font-size:2.4em;font-weight:900;margin-top:8px}
.login-logo h1 span{color:var(--yellow)}
.login-logo p{color:#7090b8;font-size:.88em;margin-top:4px}
.login-card{background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:20px;padding:30px;backdrop-filter:blur(12px)}
.login-card h2{font-family:'Poppins',sans-serif;font-size:1.1em;font-weight:700;margin-bottom:22px;text-align:center}
.lfield{margin-bottom:16px}
.lfield label{display:block;font-size:.78em;font-weight:700;color:#a0c4e8;margin-bottom:6px;letter-spacing:.5px}
.lfield input{width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:12px 14px;color:#fff;font-size:.9em;font-family:'Nunito',sans-serif;outline:none;transition:border-color .3s}
.lfield input:focus{border-color:rgba(245,197,24,.6);background:rgba(245,197,24,.04)}
.lfield input::placeholder{color:rgba(255,255,255,.25)}
.btn-login{width:100%;background:linear-gradient(135deg,var(--yellow),var(--gold));color:var(--navy);border:none;border-radius:50px;padding:14px;font-weight:900;font-size:1em;cursor:pointer;margin-top:8px;font-family:'Nunito',sans-serif;transition:all .3s}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(245,197,24,.5)}
.login-err{display:none;background:rgba(216,90,48,.15);border:1px solid rgba(216,90,48,.3);border-radius:9px;padding:10px 14px;font-size:.84em;color:#f0b090;margin-bottom:14px;text-align:center}
.login-err.show{display:block}

/* ===== TOPBAR ===== */
.topbar{background:rgba(0,0,0,.4);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.tb-logo{font-family:'Poppins',sans-serif;font-weight:900;font-size:1.1em}
.tb-logo span{color:var(--yellow)}
.tb-user{margin-left:auto;background:rgba(245,197,24,.1);border:1px solid rgba(245,197,24,.2);border-radius:50px;padding:5px 14px;font-size:.78em;font-weight:700;color:var(--yellow)}
.btn-back{background:rgba(255,255,255,.07);border:1px solid var(--border);color:#a0c4e8;border-radius:8px;padding:7px 14px;cursor:pointer;font-size:.8em;font-weight:700;font-family:'Nunito',sans-serif;display:flex;align-items:center;gap:5px;transition:all .3s}
.btn-back:hover{background:rgba(255,255,255,.14);color:#fff}
.btn-logout{background:rgba(216,90,48,.1);border:1px solid rgba(216,90,48,.2);color:#f0a080;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:.78em;font-weight:700;font-family:'Nunito',sans-serif;transition:all .3s}
.btn-logout:hover{background:rgba(216,90,48,.25)}

/* ===== HOME ===== */
#sc-home{background:linear-gradient(180deg,#060f1f,#0d1628)}
.home-hero{text-align:center;padding:36px 20px 20px}
.home-hero h2{font-family:'Poppins',sans-serif;font-size:1.6em;font-weight:800;margin-bottom:6px}
.home-hero h2 span{color:var(--yellow)}
.home-hero p{color:#7090b8;font-size:.9em}
.nivel-badge{display:inline-block;background:rgba(245,197,24,.12);border:1px solid rgba(245,197,24,.25);border-radius:50px;padding:4px 14px;font-size:.78em;font-weight:700;color:var(--yellow);margin-top:10px}
.matieres-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:20px;max-width:800px;margin:0 auto;width:100%}
.matiere-card{border-radius:16px;padding:22px 16px;cursor:pointer;transition:all .3s;border:1px solid var(--border);background:var(--navy2);text-align:center}
.matiere-card:hover{transform:translateY(-5px);border-color:rgba(255,255,255,.2)}
.matiere-icon{font-size:38px;margin-bottom:10px;display:block}
.matiere-nom{font-weight:800;font-size:.9em}
.matiere-count{font-size:.72em;color:#5070a0;margin-top:4px}

/* ===== LESSONS ===== */
#sc-lessons{background:var(--navy)}
.lessons-wrap{max-width:760px;margin:0 auto;padding:24px 20px;width:100%}
.section-title{font-family:'Poppins',sans-serif;font-size:1.2em;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.lesson-card{background:var(--navy2);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:12px;cursor:pointer;transition:all .3s;display:flex;align-items:center;gap:16px}
.lesson-card:hover{border-color:rgba(255,255,255,.2);transform:translateX(5px)}
.lesson-num{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1em;flex-shrink:0}
.lesson-info{flex:1}
.lesson-title{font-weight:700;font-size:.92em;margin-bottom:3px}
.lesson-meta{font-size:.72em;color:#5070a0}
.lesson-badge{font-size:.65em;padding:3px 10px;border-radius:50px;font-weight:700}
.badge-done{background:rgba(29,158,117,.2);color:#4dd8a0;border:1px solid rgba(29,158,117,.3)}
.badge-new{background:rgba(245,197,24,.1);color:var(--yellow);border:1px solid rgba(245,197,24,.2)}

/* ===== LESSON DETAIL ===== */
#sc-lesson{background:var(--navy)}
.lesson-wrap{max-width:780px;margin:0 auto;padding:24px 20px;width:100%}
.module-tabs{display:flex;gap:5px;background:var(--navy2);border-radius:14px;padding:5px;margin-bottom:28px;border:1px solid var(--border)}
.mtab{flex:1;padding:12px 8px;border:none;background:transparent;color:#4060a0;font-weight:800;font-size:.85em;cursor:pointer;border-radius:9px;transition:all .3s;font-family:'Nunito',sans-serif;display:flex;align-items:center;justify-content:center;gap:6px}
.mtab.active{color:#fff}
.mtab:hover:not(.active){color:#a0c4e8;background:rgba(255,255,255,.05)}
.module-panel{display:none}
.module-panel.active{display:block;animation:fadein .3s}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Audio bar */
.audio-bar{background:var(--navy2);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;gap:12px}
.btn-audio{background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;border:none;border-radius:50px;padding:10px 22px;font-weight:800;font-size:.85em;cursor:pointer;font-family:'Nunito',sans-serif;display:flex;align-items:center;gap:7px;transition:all .3s;white-space:nowrap}
.btn-audio:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(30,127,217,.4)}
.btn-audio.playing{background:linear-gradient(135deg,var(--coral),#b34a20)}
.audio-info{flex:1;font-size:.8em;color:#5070a0}
.audio-progress{width:100%;height:4px;background:rgba(255,255,255,.08);border-radius:10px;margin-top:6px;overflow:hidden}
.audio-progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:10px;width:0%;transition:width .5s}

/* Theory sections */
.theory-section{background:var(--navy2);border:1px solid var(--border);border-radius:13px;padding:16px 18px;margin-bottom:12px;border-left:4px solid var(--blue);transition:all .3s;cursor:pointer}
.theory-section:hover{background:rgba(255,255,255,.04)}
.theory-section.highlight{border-left-color:var(--yellow)}
.theory-header{display:flex;align-items:center;justify-content:space-between}
.theory-title{font-weight:800;font-size:.9em;color:var(--yellow);display:flex;align-items:center;gap:7px}
.theory-arrow{color:#4060a0;transition:transform .3s;font-size:.8em}
.theory-section.open .theory-arrow{transform:rotate(90deg)}
.theory-body{display:none;margin-top:10px;color:#a0bcd8;font-size:.87em;line-height:1.75}
.theory-section.open .theory-body{display:block;animation:fadein .3s}
.btn-read-section{background:rgba(30,127,217,.15);border:1px solid rgba(30,127,217,.3);color:var(--sky);border-radius:7px;padding:5px 12px;font-size:.72em;font-weight:700;cursor:pointer;margin-top:8px;display:inline-flex;align-items:center;gap:5px;font-family:'Nunito',sans-serif}

/* Flashcards */
.flash-hint{background:rgba(29,158,117,.07);border:1px solid rgba(29,158,117,.15);border-radius:10px;padding:10px 14px;font-size:.8em;color:#5090a0;margin-bottom:16px;text-align:center}
.flash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px;margin-bottom:24px}
.flash-card{height:200px;cursor:pointer;perspective:1000px}
.flash-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,0,.2,1)}
.flash-card.flipped .flash-inner{transform:rotateY(180deg)}
.flash-front,.flash-back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:13px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.flash-front{background:linear-gradient(135deg,rgba(30,127,217,.18),rgba(29,158,117,.08));border:1px solid rgba(255,255,255,.1)}
.flash-q{font-weight:700;font-size:.88em;color:var(--sky);line-height:1.4}
.flash-hint-txt{font-size:.62em;color:rgba(255,255,255,.3);margin-top:8px}
.flash-back{background:linear-gradient(135deg,rgba(29,158,117,.2),rgba(30,127,217,.12));border:1px solid rgba(29,158,117,.35);transform:rotateY(180deg);justify-content:flex-start;padding-top:14px}
.flash-a{font-size:.83em;line-height:1.55;color:#c0f0e0;font-weight:600;margin-bottom:10px}
.flash-mastery-btns{display:flex;gap:6px;margin-top:auto;width:100%}
.flash-mastery-btns button{flex:1;border:none;border-radius:8px;padding:5px 4px;font-size:.7em;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;transition:all .2s;opacity:.7}
.flash-mastery-btns button:hover{opacity:1;transform:scale(1.06)}
.fmb-no{background:rgba(216,90,48,.3);color:#ffb090}
.fmb-mid{background:rgba(245,197,24,.2);color:#ffe080}
.fmb-ok{background:rgba(29,158,117,.3);color:#80f0c0}
.flash-badge{position:absolute;top:8px;right:8px;font-size:.65em;padding:2px 7px;border-radius:20px;font-weight:800;z-index:2}
.flash-badge.badge-no{background:rgba(216,90,48,.3);color:#ffb090}
.flash-badge.badge-mid{background:rgba(245,197,24,.2);color:#ffe080}
.flash-badge.badge-ok{background:rgba(29,158,117,.3);color:#80f0c0}
/* Mastery progress bar */
.flash-progress-wrap{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.flash-progress-label{font-size:.78em;color:#7090b0;margin-bottom:8px;display:flex;justify-content:space-between}
.flash-progress-label span{font-weight:800;color:#c0d8f0}
.flash-progress-bar{height:8px;border-radius:20px;background:rgba(255,255,255,.07);overflow:hidden}
.flash-progress-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--blue),var(--teal));transition:width .5s ease}
.flash-progress-stars{display:flex;gap:10px;margin-top:10px;font-size:.78em}
.flash-progress-stars span{display:flex;align-items:center;gap:4px}

/* Mini exercises */
.mini-ex{background:rgba(245,197,24,.05);border:1px solid rgba(245,197,24,.15);border-radius:13px;padding:16px;margin-bottom:13px}
.mini-ex-q{font-weight:700;font-size:.9em;margin-bottom:10px;color:#d4c080}
.mini-ex-input{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:10px 13px;color:#fff;font-size:.9em;font-family:'Nunito',sans-serif;outline:none;transition:border-color .3s}
.mini-ex-input:focus{border-color:rgba(245,197,24,.5)}
.btn-check{background:var(--yellow);color:var(--navy);border:none;border-radius:8px;padding:9px 22px;font-weight:800;font-size:.85em;cursor:pointer;margin-top:9px;font-family:'Nunito',sans-serif;transition:all .3s}
.btn-check:hover{background:var(--gold);transform:translateY(-1px)}
.mini-result{margin-top:9px;padding:9px 13px;border-radius:8px;font-size:.83em;display:none}
.mini-result.show{display:block}
.mini-result.ok{background:rgba(29,158,117,.12);border:1px solid rgba(29,158,117,.25);color:#80e8c0}
.mini-result.nok{background:rgba(216,90,48,.08);border:1px solid rgba(216,90,48,.2);color:#f0b090}
/* ===== STEP-BY-STEP LEARNING ===== */
.lesson-progress{background:rgba(255,255,255,.06);border-radius:50px;height:8px;margin-bottom:24px;overflow:hidden}
.lesson-progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--yellow));border-radius:50px;transition:width .6s}
.step-card{background:var(--navy2);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:20px}
.step-header{background:linear-gradient(135deg,rgba(30,127,217,.2),rgba(29,158,117,.1));padding:14px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
.step-num-badge{background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;border-radius:8px;padding:4px 12px;font-size:.75em;font-weight:900}
.step-body{padding:18px}
.step-content{color:#b0cce8;font-size:.9em;line-height:1.9;margin-bottom:16px;white-space:pre-line}
.step-audio-btn{background:linear-gradient(135deg,rgba(29,158,117,.2),rgba(30,127,217,.1));border:1px solid rgba(29,158,117,.3);color:#4dd8a0;border-radius:50px;padding:9px 22px;font-weight:700;font-size:.82em;cursor:pointer;font-family:'Nunito',sans-serif;display:inline-flex;align-items:center;gap:7px;margin-bottom:18px}
.step-check{background:rgba(245,197,24,.05);border:1px solid rgba(245,197,24,.15);border-radius:12px;padding:16px}
.step-check-q{font-weight:700;font-size:.9em;color:#d4c080;margin-bottom:12px}
.step-check-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step-opt{background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 13px;cursor:pointer;transition:all .3s;font-size:.86em;font-weight:600;text-align:left;color:#c0d4e8;display:flex;align-items:center;gap:9px;font-family:'Nunito',sans-serif;width:100%}
.step-opt.correct{background:rgba(29,158,117,.2);border-color:rgba(29,158,117,.6);color:#a0f0d0}
.step-opt.wrong{background:rgba(216,90,48,.15);border-color:rgba(216,90,48,.5);color:#f0c0a0}
.step-opt.revealed{opacity:.35;pointer-events:none}
.step-letter{width:26px;height:26px;border-radius:6px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.78em;flex-shrink:0}
.step-feedback{margin-top:12px;padding:11px 14px;border-radius:10px;font-size:.84em;display:none;line-height:1.55}
.step-feedback.show{display:block}
.step-feedback.ok{background:rgba(29,158,117,.12);border:1px solid rgba(29,158,117,.25);color:#80e8c0}
.step-feedback.nok{background:rgba(216,90,48,.08);border:1px solid rgba(216,90,48,.2);color:#f0b090}
.btn-next-step{background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;border:none;border-radius:50px;padding:11px 28px;font-weight:800;font-size:.88em;cursor:pointer;margin-top:12px;font-family:'Nunito',sans-serif;display:none;align-items:center;gap:7px}
.btn-next-step.show{display:inline-flex}
.steps-complete{text-align:center;padding:40px 20px}
.steps-complete-icon{font-size:70px;margin-bottom:16px;display:block}
.steps-complete h3{font-family:'Poppins',sans-serif;font-size:1.3em;font-weight:800;color:var(--yellow);margin-bottom:8px}
.btn-to-exercicios{background:linear-gradient(135deg,var(--yellow),var(--gold));color:var(--navy);border:none;border-radius:50px;padding:13px 36px;font-weight:900;font-size:.95em;cursor:pointer;font-family:'Nunito',sans-serif}


/* QCM exercises */
.ex-qcm-opts{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.ex-qcm-opt{background:rgba(255,255,255,.05);border:1.5px solid var(--border);border-radius:10px;padding:11px 16px;color:#c8d8f0;font-size:.9em;text-align:left;cursor:pointer;transition:all .2s;font-family:Poppins,sans-serif}
.ex-qcm-opt:hover:not(:disabled){background:rgba(30,127,217,.15);border-color:var(--blue);color:#fff}
.ex-qcm-opt:disabled{cursor:default}
.ex-qcm-opt.ex-qcm-correct{background:rgba(29,158,117,.2);border-color:#1d9e75;color:#4dffc3;font-weight:700}
.ex-qcm-opt.ex-qcm-wrong{background:rgba(255,80,80,.15);border-color:#ff5050;color:#ff8888}
.btn-retry-ex{background:rgba(245,197,24,.12);border:1px solid rgba(245,197,24,.35);color:var(--yellow);border-radius:8px;padding:9px 18px;font-weight:700;font-size:.82em;cursor:pointer;font-family:'Nunito',sans-serif;transition:all .3s;display:inline-flex;align-items:center;gap:6px}
.btn-retry-ex:hover{background:rgba(245,197,24,.25)}
@keyframes exHighlight{0%{box-shadow:0 0 0 0 rgba(245,197,24,.6)}50%{box-shadow:0 0 0 8px rgba(245,197,24,.2)}100%{box-shadow:0 0 0 0 rgba(245,197,24,0)}}
.ex-highlight{animation:exHighlight 1.5s ease-out;border-color:rgba(245,197,24,.5)!important}

/* Exercises */
.ex-item{background:var(--navy2);border:1px solid var(--border);border-radius:13px;padding:18px;margin-bottom:13px;transition:all .3s}
.ex-item:hover{border-color:rgba(255,255,255,.15)}
.ex-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ex-num{background:linear-gradient(135deg,var(--blue),var(--teal));border-radius:8px;padding:4px 12px;font-size:.75em;font-weight:900;color:#fff;flex-shrink:0}
.ex-dif{display:flex;gap:3px}
.ex-star{font-size:.7em}
.ex-enonce{font-size:.9em;color:#c0d4e8;line-height:1.6;flex:1}
.ex-answer-area{margin-top:12px}
.ex-input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:10px 13px;color:#fff;font-size:.88em;font-family:'Nunito',sans-serif;outline:none;transition:border-color .3s}
.ex-input:focus{border-color:rgba(30,127,217,.5)}
.ex-btns{display:flex;gap:8px;margin-top:9px}
.btn-correction{background:rgba(29,158,117,.15);border:1px solid rgba(29,158,117,.3);color:#4dd8a0;border-radius:8px;padding:9px 18px;font-weight:700;font-size:.82em;cursor:pointer;font-family:'Nunito',sans-serif;transition:all .3s;display:flex;align-items:center;gap:6px}
.btn-correction:hover{background:rgba(29,158,117,.3)}
.btn-audio-ex{background:rgba(30,127,217,.12);border:1px solid rgba(30,127,217,.25);color:var(--sky);border-radius:8px;padding:9px 16px;font-weight:700;font-size:.82em;cursor:pointer;font-family:'Nunito',sans-serif;transition:all .3s;display:flex;align-items:center;gap:5px}
.btn-audio-ex:hover{background:rgba(30,127,217,.25)}
.corr-box{display:none;margin-top:12px;background:rgba(29,158,117,.1);border:1px solid rgba(29,158,117,.25);border-radius:10px;padding:13px 15px;font-size:.85em;color:#a0f0d0;line-height:1.65}
.corr-box.show{display:block;animation:fadein .3s}

/* Toast */

<script>
const SB = 'https://kdyrvvfkepwkwrtwafmo.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkeXJ2dmZrZXB3a3dydHdhZm1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxODE2ODMsImV4cCI6MjEwNTc1NzY4M30.bFgWh8GbpZUTgG6wwuJi2wmE3ZvGXBvfkKydwdR0OoY';

var user = null;
var curMatiere = null;
var curLesson = null;
var synth = window.speechSynthesis;
var utterance = null;
var speaking = false;
var audioBtn = null;

// ===== SUPABASE =====
function sb(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }, opts.headers || {});
  return fetch(SB + path, opts).then(function(r) { return r.status === 204 ? {} : r.json(); });
}

// ===== STARS =====
(function() {
  var c = document.getElementById('loginStars');
  for (var i = 0; i < 60; i++) {
    var s = document.createElement('div'); s.className = 'lstar';
    var sz = Math.random() * 3 + 1;
    s.style.cssText = 'left:' + Math.random()*100 + '%;top:' + Math.random()*100 + '%;width:' + sz + 'px;height:' + sz + 'px;animation-delay:' + Math.random()*3 + 's;animation-duration:' + (Math.random()*2+1.5) + 's';
    c.appendChild(s);
  }
})();

// ===== SCREENS =====
function show(id) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

// ===== TOAST =====
function toast(msg) {
  var t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast show';
  setTimeout(function() { t.className = 'toast'; }, 3000);
}

// ===== AUDIO =====
function getSpanishVoice() {
  var voices = synth.getVoices();
  // Priorité : voix masculine espagnole
  var esMale = voices.filter(function(v) {
    var n = v.name.toLowerCase();
    return v.lang.indexOf('es') === 0 && (n.indexOf('male') !== -1 || n.indexOf('jorge') !== -1 || n.indexOf('diego') !== -1 || n.indexOf('carlos') !== -1 || n.indexOf('pablo') !== -1 || n.indexOf('juan') !== -1 || n.indexOf('miguel') !== -1 || n.indexOf('antonio') !== -1 || n.indexOf('alvaro') !== -1 || n.indexOf('sergio') !== -1 || n.indexOf('enrique') !== -1);
  });
  if (esMale.length > 0) return esMale[0];
  // Fallback : n'importe quelle voix espagnole
  var es = voices.filter(function(v) { return v.lang.indexOf('es') === 0; });
  return es.length > 0 ? es[0] : voices[0];
}

function cleanMath(text) {
  return text
    .replace(/×/g, ' por ')
    .replace(/\*/g, ' por ')
    .replace(/÷/g, ' entre ')
    .replace(/²/g, ' al cuadrado ')
    .replace(/³/g, ' al cubo ')
    .replace(/\^(\d+)/g, ' elevado a $1 ')
    .replace(/⁰/g, ' elevado a cero ')
    .replace(/¹/g, ' elevado a uno ')
    .replace(/⁴/g, ' elevado a cuatro ')
    .replace(/⁵/g, ' elevado a cinco ')
    .replace(/⁻/g, ' elevado a menos ')
    .replace(/√/g, ' raíz cuadrada de ')
    .replace(/=/g, ' es igual a ')
    .replace(/\s+/g, ' ').trim();
}

function speak(text, btnEl) {
  text = cleanMath(text);
  if (speaking) { synth.cancel(); speaking = false; if (audioBtn) { audioBtn.textContent = '▶️ Escuchar'; audioBtn.classList.remove('playing'); } if (audioBtn === btnEl) { audioBtn = null; return; } }
  utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'es-ES';
  utterance.rate = 0.88;
  utterance.pitch = 0.85;
  var voice = getSpanishVoice();
  if (voice) utterance.voice = voice;
  speaking = true; audioBtn = btnEl;
  if (btnEl) { btnEl.textContent = '⏹️ Parar'; btnEl.classList.add('playing'); }
  utterance.onend = function() { speaking = false; if (btnEl) { btnEl.textContent = '▶️ Escuchar'; btnEl.classList.remove('playing'); } audioBtn = null; };
  utterance.onerror = function() { speaking = false; if (btnEl) { btnEl.textContent = '▶️ Escuchar'; btnEl.classList.remove('playing'); } audioBtn = null; };
  synth.speak(utterance);
}

// ===== LOGIN =====
function doLogin() {
  var email = document.getElementById('loginEmail').value.trim();
  var pwd = document.getElementById('loginPwd').value.trim();
  var err = document.getElementById('loginErr');
  err.classList.remove('show');
  if (!email || !pwd) { err.classList.add('show'); return; }
  sb('/rest/v1/users?email=eq.' + encodeURIComponent(email) + '&password_hash=eq.' + encodeURIComponent(pwd) + '&select=*')
  .then(function(data) {
    if (data && data.length > 0) {
      user = data[0];
      localStorage.setItem('notaplus_user', JSON.stringify(user));
      showHome();
    } else { err.classList.add('show'); }
  }).catch(function() { err.classList.add('show'); });
}

function doLogout() {
  user = null; localStorage.removeItem('notaplus_user');
  synth.cancel(); speaking = false;
  show('sc-login');
}

// ===== HOME =====
function showHome() {
  if (!user) { show('sc-login'); return; }
  show('sc-home');
  document.getElementById('heroName').textContent = user.full_name.split(' ')[0];
  document.getElementById('heroBadge').textContent = user.nivel || '1ESO';
  document.getElementById('tbUser').textContent = '👤 ' + user.full_name.split(' ')[0];
  document.getElementById('tbUser2').textContent = '👤 ' + user.full_name.split(' ')[0];
  document.getElementById('tbUser3').textContent = '👤 ' + user.full_name.split(' ')[0];
  loadMatieres();
}

function loadMatieres() {
  var grid = document.getElementById('matieresGrid');
  grid.innerHTML = '<div class="spinner"></div>';
  sb('/rest/v1/matieres?order=ordre&select=*')
  .then(function(data) {
    grid.innerHTML = '';
    (data || []).forEach(function(m) {
      var card = document.createElement('div'); card.className = 'matiere-card';
      card.style.cssText = 'border-color:' + m.couleur + '33;box-shadow:0 4px 20px ' + m.couleur + '15';
      card.innerHTML = '<span class="matiere-icon">' + m.icone + '</span><div class="matiere-nom">' + m.nom + '</div><div class="matiere-count">Ver lecciones →</div>';
      card.onmouseover = function() { this.style.borderColor = m.couleur + '88'; this.style.boxShadow = '0 8px 32px ' + m.couleur + '30'; };
      card.onmouseout = function() { this.style.borderColor = m.couleur + '33'; this.style.boxShadow = '0 4px 20px ' + m.couleur + '15'; };
      card.onclick = function() { curMatiere = m; showLessons(); };
      grid.appendChild(card);
    });
  });
}

// ===== LESSONS =====
function showLessons() {
  if (!curMatiere) return;
  show('sc-lessons');
  document.getElementById('lessonsHeader').innerHTML = curMatiere.icone + ' ' + curMatiere.nom + ' — ' + (user ? user.nivel : '');
  var list = document.getElementById('lessonsList');
  list.innerHTML = '<div class="spinner"></div>';
  sb('/rest/v1/lessons?matiere_id=eq.' + curMatiere.id + '&niveau=eq.' + (user.nivel || '1ESO') + '&order=numero&select=*')
  .then(function(data) {
    list.innerHTML = '';
    if (!data || data.length === 0) {
      list.innerHTML = '<div style="text-align:center;padding:60px;color:#4060a0">📚 Pronto habrá lecciones aquí.<br><br>Tu profesor está preparando el contenido.</div>';
      return;
    }
    data.forEach(function(lesson) {
      var card = document.createElement('div'); card.className = 'lesson-card';
      card.innerHTML = '<div class="lesson-num" style="background:linear-gradient(135deg,' + curMatiere.couleur + ',' + curMatiere.couleur + 'aa);color:#fff">' + lesson.numero + '</div><div class="lesson-info"><div class="lesson-title">' + lesson.titre + '</div><div class="lesson-meta">2 módulos · Audios en español</div></div><span class="lesson-badge badge-new">Nuevo</span>';
      card.onclick = function() { curLesson = lesson; showLesson(); };
      list.appendChild(card);
    });
  });
}

// ===== LESSON DETAIL =====
function showLesson() {
  if (!curLesson) return;
  show('sc-lesson');
  document.getElementById('lessonTopTitle').innerHTML = curMatiere.icone + ' ' + curLesson.titre + ' <span style="color:var(--yellow)"></span>';
  switchModule('aprender');
}

function switchModule(mod) {
  document.querySelectorAll('.mtab').forEach(function(b) { b.classList.remove('active'); b.style.background = ''; });
  document.querySelectorAll('.module-panel').forEach(function(p) { p.classList.remove('active'); });
  var btn = document.getElementById('mtab-' + mod); btn.classList.add('active');
  if (mod === 'aprender') btn.style.background = 'linear-gradient(135deg,#1e7fd9,#1d9e75)';
  else if (mod === 'flashcards') btn.style.background = 'linear-gradient(135deg,#1d6faa,#0e4f8a)';
  else if (mod === 'ejercicios') btn.style.background = 'linear-gradient(135deg,#D85A30,#b34a20)';
  else btn.style.background = 'linear-gradient(135deg,#8B5CF6,#5B21B6)';
  document.getElementById('mp-' + mod).classList.add('active');
  synth.cancel(); speaking = false;
  if (mod === 'aprender') renderAprender();
  else if (mod === 'flashcards') renderFlashcards();
  else if (mod === 'ejercicios') renderEjercicios();
  else renderJugar();
}

// ===== MODULE APRENDER =====
function renderAprender() {
  var panel = document.getElementById('mp-aprender');

  // ── NEW: step-by-step mode ──
  var steps = curLesson.steps || [];
  if (steps.length > 0) {
    renderSteps(steps);
    return;
  }

  // ── LEGACY: sections mode ──
  var c = curLesson.contenu || {};
  var fc = curLesson.flashcards || [];
  var mx = curLesson.mini_exercices || [];
  var sections = c.sections || [];

  var fullText = 'Bienvenido a la lección: ' + curLesson.titre + '. ' + (c.intro || '') + '. ';
  sections.forEach(function(s) { fullText += s.titulo + '. ' + s.texto + '. '; });
  window._fullLessonText = fullText;

    html += '<div class="theory-section" id="ts' + i + '"><div class="theory-header" onclick="toggleSection(' + i + ')"><div class="theory-title">📌 ' + s.titulo + '</div><span class="theory-arrow">▶</span></div><div class="theory-body">' + s.texto + '<br><br><button class="btn-read-section" onclick="speakSectionIdx(this,' + (i+1) + ')">🔊 Escuchar</button></div></div>';
  });

  if (fc.length > 0) {
    html += '<div style="margin-top:28px"><div style="font-family:Poppins,sans-serif;font-size:1em;font-weight:700;color:var(--sky);margin-bottom:10px">🃏 Tarjetas de repaso</div><div class="flash-hint">💡 Haz clic en la tarjeta para ver la respuesta</div><div class="flash-grid">';
    fc.forEach(function(card, i) {
      html += '<div class="flash-card" id="fc' + i + '" onclick="flipCard(' + i + ')"><div class="flash-inner"><div class="flash-front"><div class="flash-q">' + card.pregunta + '</div><div class="flash-hint-txt">Toca para ver ↩</div></div><div class="flash-back"><div class="flash-a">' + card.respuesta + '</div></div></div></div>';
    });

  if (mx.length > 0) html += buildMiniExHtml(mx);

  panel.innerHTML = html;
  panel._fullText = fullText;

// ===== STEP-BY-STEP ENGINE =====
var _curStepIdx = 0;
var _stepsData = [];

function renderSteps(steps) {
  _stepsData = steps;
  _curStepIdx = 0;
  showStep(0);
}

function showStep(idx) {
  var panel = document.getElementById('mp-aprender');
  var total = _stepsData.length;
  if (idx >= total) { showStepsComplete(); return; }
  var step = _stepsData[idx];
  var pct = Math.round(idx / total * 100);
  var letters = ['A','B','C','D'];

  // Mélanger les options à chaque affichage
  var origOpts = step.check.opciones || [];
  var origCorrect = parseInt(step.check.correcta);
  var shuffled = origOpts.map(function(op, j) { return {text: op, origIdx: j}; });
  for (var s = shuffled.length - 1; s > 0; s--) {
    var r = Math.floor(Math.random() * (s + 1));
    var tmp = shuffled[s]; shuffled[s] = shuffled[r]; shuffled[r] = tmp;
  }
  var newCorrect = shuffled.findIndex(function(o) { return o.origIdx === origCorrect; });
  step._shuffled = shuffled;
  step._newCorrect = newCorrect;

  var optsHtml = '<div class="step-check-opts">';
  shuffled.forEach(function(op, j) {
    optsHtml += '<button class="step-opt" id="sopt' + idx + '_' + j + '" onclick="answerStep(' + idx + ',' + j + ')">' +
      '<span class="step-letter">' + letters[j] + '</span>' + op.text + '</button>';
  });
  optsHtml += '</div>';

  var contentHtml = (step.contenido || '').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

  panel.innerHTML =
    '<div style="display:flex;justify-content:space-between;font-size:.75em;color:#5070a0;margin-bottom:6px"><span>Punto ' + (idx+1) + ' de ' + total + '</span><span>' + pct + '%</span></div>' +
    '<div class="lesson-progress"><div class="lesson-progress-fill" style="width:' + pct + '%"></div></div>' +
    '<div class="step-card">' +
      '<div class="step-header">' +
        '<span class="step-num-badge">' + (idx+1) + '/' + total + '</span>' +
        '<div style="font-family:Poppins,sans-serif;font-weight:700;font-size:.95em;flex:1">' + (step.titulo || '') + '</div>' +
      '</div>' +
      '<div class="step-body">' +
        '<div class="step-content">' + contentHtml + '</div>' +
        '<button class="step-audio-btn" id="stepAudioBtn" onclick="speakStep(' + idx + ')">🔊 Écouter l\'explication</button>' +
        '<div class="step-check">' +
          '<div class="step-check-q">❓ ' + (step.check.pregunta || '') + '</div>' +
          optsHtml +
          '<div class="step-feedback" id="sfb' + idx + '"></div>' +
          '<button class="btn-next-step" id="btnNextStep" onclick="goNextStep(' + idx + ')">Siguiente punto →</button>' +
        '</div>' +
      '</div>' +
    '</div>';
}

function speakStep(idx) {
  var btn = document.getElementById('stepAudioBtn');
  var step = _stepsData[idx];
  speak(step.audio || step.titulo, btn);
}

function answerStep(idx, chosen) {
  var step = _stepsData[idx];
  var shuffled = step._shuffled || (step.check.opciones || []).map(function(t,j){return {text:t,origIdx:j};});
  var correct = (step._newCorrect !== undefined) ? step._newCorrect : parseInt(step.check.correcta);
  var correctText = (shuffled[correct] || {}).text || '';
  shuffled.forEach(function(_, j) {
    var btn = document.getElementById('sopt' + idx + '_' + j);
    if (!btn) return;
    btn.disabled = true;
    if (j === correct) btn.classList.add('correct');
    else if (j === chosen) btn.classList.add('wrong');
    else btn.classList.add('revealed');
  });
  var ok = chosen === correct;
  var fb = document.getElementById('sfb' + idx);
  fb.className = 'step-feedback show ' + (ok ? 'ok' : 'nok');
  var expl = step.check.explicacion || '';
  if (ok) {
    fb.innerHTML = '✅ ¡Muy bien! ' + expl;
  } else {
    fb.innerHTML = '❌ No es correcto. La respuesta correcta es: ' + correctText + '. ' + expl +
      '<br><button class="btn-retry-ex" style="margin-top:10px" onclick="retryStep(' + idx + ')">🔄 Nueva pregunta</button>';
  }
  speak(ok ? '¡Muy bien! ' + expl : 'No es correcto. La respuesta correcta es: ' + correctText + '. ' + expl, null);
  var nxt = document.getElementById('btnNextStep');
  if (nxt) nxt.className = 'btn-next-step show';
}

function retryStep(idx) {
  var all = _stepsData || [];
  var pool = all.filter(function(s, i) { return i !== idx && s.check && s.check.opciones && s.check.opciones.length; });
  if (!pool.length) pool = all.filter(function(s, i) { return s.check && s.check.opciones && s.check.opciones.length; });
  if (!pool.length) return;
  var pick = pool[Math.floor(Math.random() * pool.length)];
  var pickIdx = all.indexOf(pick);
  delete pick._shuffled;
  delete pick._newCorrect;
  showStep(pickIdx);
}

function goNextStep(idx) {
  _curStepIdx = idx + 1;
  showStep(_curStepIdx);
  window.scrollTo(0, 0);
}

function showStepsComplete() {
  var panel = document.getElementById('mp-aprender');
  var fc = curLesson.flashcards || [];
  var mx = curLesson.mini_exercices || [];
  var fcHtml = '';
  if (fc.length > 0) {
    fcHtml += '<div style="margin-top:28px"><div style="font-family:Poppins,sans-serif;font-size:1em;font-weight:700;color:var(--sky);margin-bottom:10px">🃏 Tarjetas de repaso</div><div class="flash-hint">💡 Haz clic en la tarjeta para ver la respuesta</div><div class="flash-grid">';
    fc.forEach(function(card, i) {
      fcHtml += '<div class="flash-card" id="fc' + i + '" onclick="flipCard(' + i + ')"><div class="flash-inner"><div class="flash-front"><div class="flash-q">' + card.pregunta + '</div><div class="flash-hint-txt">Toca para ver ↩</div></div><div class="flash-back"><div class="flash-a">' + card.respuesta + '</div></div></div></div>';
    });
    fcHtml += '</div></div>';
  }
  var mxHtml = mx.length > 0 ? buildMiniExHtml(mx) : '';
  panel.innerHTML =
    '<div class="steps-complete">' +
      '<span class="steps-complete-icon">🏆</span>' +

    '</div>' +

}

function toggleMainAudio() {
  var btn = document.getElementById('mainAudioBtn');
  speak(window._fullLessonText || curLesson.titre, btn);
}

function speakSectionIdx(btn, idx) {
  var texts = window._sectionTexts || [];
  speak(texts[idx] || '', btn);
}

function toggleSection(i) {
  var el = document.getElementById('ts' + i);
  el.classList.toggle('open');
}

function flipCard(i) {
  var card = document.getElementById('fc' + i);
  card.classList.toggle('flipped');
  if (card.classList.contains('flipped')) {
    var fc = curLesson.flashcards || [];
    if (fc[i]) speak(fc[i].respuesta, null);
  }
}

function shuffleOpts(opciones, correcta) {
  var arr = opciones.map(function(t, j) { return {text: t, origIdx: j}; });
  for (var s = arr.length - 1; s > 0; s--) {
    var r = Math.floor(Math.random() * (s + 1));
    var tmp = arr[s]; arr[s] = arr[r]; arr[r] = tmp;
  }
  var newCorrect = arr.findIndex(function(o) { return o.origIdx === correcta; });
  return {arr: arr, newCorrect: newCorrect};
}

function buildMiniExHtml(mx) {
  var letters = ['A','B','C','D'];
  var html = '<div style="margin-top:24px"><div style="font-family:Poppins,sans-serif;font-size:1em;font-weight:700;color:var(--yellow);margin-bottom:12px">🧩 Mini ejercicios</div>';
  // mélanger et stocker
  var shuffledMx = mx.map(function(ex) {
    if (ex.opciones && ex.opciones.length > 0) {
      var s = shuffleOpts(ex.opciones, parseInt(ex.correcta));
      return Object.assign({}, ex, {_shuffled: s.arr, _newCorrect: s.newCorrect});
    }
    return ex;
  });
  window._miniExData = shuffledMx;
  shuffledMx.forEach(function(ex, i) {
    if (ex._shuffled) {
      var opts = '<div class="step-check-opts" id="mxopts' + i + '">';
      ex._shuffled.forEach(function(op, j) {
        opts += '<button class="step-opt" id="mxopt' + i + '_' + j + '" onclick="checkMiniQcm(' + i + ',' + j + ')">' +
          '<span class="step-letter">' + letters[j] + '</span>' + op.text + '</button>';
      });
      opts += '</div>';
      html += '<div class="mini-ex" id="mxitem' + i + '"><div class="mini-ex-q">' + ex.pregunta + '</div>' + opts + '<div class="mini-result" id="mxr' + i + '"></div></div>';
    } else {
      html += '<div class="mini-ex" id="mxitem' + i + '"><div class="mini-ex-q">' + ex.pregunta + '</div><input type="text" class="mini-ex-input" id="mx' + i + '" placeholder="Tu respuesta..."><button class="btn-check" onclick="checkMiniIdx(' + i + ')">Comprobar ✓</button><div class="mini-result" id="mxr' + i + '"></div></div>';
    }
  });
  html += '</div>';
  return html;
}

function checkMiniQcm(i, chosen) {
  var data = (window._miniExData || [])[i];
  if (!data) return;
  var correct = (data._newCorrect !== undefined) ? data._newCorrect : parseInt(data.correcta);
  var expl = data.explicacion || '';
  var correctText = data._shuffled ? (data._shuffled[correct] || {}).text || '' : (data.opciones || [])[correct] || '';
  var opts = document.getElementById('mxopts' + i);
  if (opts) opts.querySelectorAll('.step-opt').forEach(function(b, j) {
    b.disabled = true;
    if (j === correct) b.classList.add('correct');
    else if (j === chosen) b.classList.add('wrong');
    else b.classList.add('revealed');
  });
  var res = document.getElementById('mxr' + i);
  var ok = chosen === correct;
  if (ok) {
    res.className = 'mini-result show ok';
    res.innerHTML = '✅ ¡Correcto! ' + expl;
    speak('¡Muy bien! ' + expl, null);
  } else {
    res.className = 'mini-result show nok';
    res.innerHTML = '❌ No exactamente. La respuesta correcta es: ' + correctText + '. ' + expl +
      '<br><button class="btn-check" style="margin-top:10px" onclick="retryMiniEx(' + i + ')">🔄 Nueva pregunta</button>';
    speak('No exactamente. La respuesta correcta es: ' + correctText + '. ' + expl, null);
  }
}

function checkMiniIdx(i) {
  var data = (window._miniExData || [])[i];
  if (!data) return;
  var val = document.getElementById('mx' + i).value.trim().toLowerCase();
  var correct = data.respuesta || ''; var expl = data.explicacion || '';
  var res = document.getElementById('mxr' + i);
  var ok = val === correct.toLowerCase() || val.replace(/\s/g,'') === correct.toLowerCase().replace(/\s/g,'');
  if (ok) {
    res.className = 'mini-result show ok';
    res.innerHTML = '✅ ¡Correcto! ' + expl;
    speak('¡Muy bien! ' + expl, null);
  } else {
    res.className = 'mini-result show nok';
    res.innerHTML = '❌ No exactamente. La respuesta es: ' + correct + '. ' + expl +
      '<br><button class="btn-check" style="margin-top:10px" onclick="retryMiniEx(' + i + ')">🔄 Nueva pregunta</button>';
    speak('No exactamente. La respuesta es: ' + correct + '. ' + expl, null);
  }
}

function retryMiniEx(i) {
  var allData = window._miniExData || [];
  if (!allData.length) return;
  var pool = allData.filter(function(_, idx) { return idx !== i; });
  if (!pool.length) pool = allData;
  var pick = pool[Math.floor(Math.random() * pool.length)];
  var pickIdx = allData.indexOf(pick);
  var item = document.getElementById('mxitem' + pickIdx);
  if (!item) return;
  var res = document.getElementById('mxr' + pickIdx);
  if (res) { res.innerHTML = ''; res.className = 'mini-result'; }
  var opts = document.getElementById('mxopts' + pickIdx);
  if (opts) opts.querySelectorAll('.step-opt').forEach(function(b) {
    b.disabled = false;
    b.classList.remove('correct','wrong','revealed');
  });
  var inp = document.getElementById('mx' + pickIdx);
  if (inp) inp.value = '';
  item.scrollIntoView({behavior:'smooth', block:'center'});
  item.style.outline = '2px solid var(--yellow)';
  setTimeout(function(){ item.style.outline = ''; }, 1500);
}

// ===== MODULE FLASHCARDS =====
function _fcKey() { return 'fc_mastery_' + (curLesson && curLesson.id || 'x'); }
function _fcGetMastery() { try { return JSON.parse(localStorage.getItem(_fcKey()) || '{}'); } catch(e){ return {}; } }
function _fcSetMastery(idx, level) {
  var m = _fcGetMastery(); m[idx] = level;
  try { localStorage.setItem(_fcKey(), JSON.stringify(m)); } catch(e){}
  _fcUpdateProgress();
}
function _fcUpdateProgress() {
  var fc = curLesson.flashcards || [];
  var m = _fcGetMastery();
  var no = 0, mid = 0, ok = 0;
  fc.forEach(function(_, i) {
    var v = m[i] || 0;
    if (v === 1) no++; else if (v === 2) mid++; else if (v === 3) ok++;
  });
  var rated = no + mid + ok;
  var pct = fc.length ? Math.round(ok / fc.length * 100) : 0;
  var bar = document.getElementById('fcProgressFill');
  if (bar) bar.style.width = pct + '%';
  var lbl = document.getElementById('fcProgressPct');
  if (lbl) lbl.textContent = pct + '%';
  var stats = document.getElementById('fcProgressStats');
  if (stats) stats.innerHTML =
    '<span>❓ ' + (fc.length - rated) + ' por ver</span>' +
    '<span>🔄 ' + mid + ' en curso</span>' +
    '<span>✅ ' + ok + ' dominadas</span>';
  // update badges
  fc.forEach(function(_, i) {
    var badge = document.getElementById('fcbadge' + i);
    if (!badge) return;
    var v = m[i] || 0;
    badge.className = 'flash-badge' + (v===1?' badge-no':v===2?' badge-mid':v===3?' badge-ok':'');
    badge.textContent = v===1?'❓ Repasar':v===2?'🔄 En curso':v===3?'✅ Dominada':'';
  });
}

        '<div class="flash-front">' +

function setMastery(idx, level) {

// ===== MODULE EJERCICIOS =====
function renderEjercicios() {
  var panel = document.getElementById('mp-ejercicios');
  panel.innerHTML = '<div class="spinner"></div>';
  sb('/rest/v1/exercises?lesson_id=eq.' + curLesson.id + '&order=numero_ex.asc&select=*')
  .then(function(data) {
    if (!data || data.length === 0) {
      panel.innerHTML = '<div style="text-align:center;padding:60px;color:#4060a0">✏️ El profesor está preparando los ejercicios.</div>';
      return;
    }
    data.sort(function(a, b){ return parseInt(a.numero_ex) - parseInt(b.numero_ex); });
    window._corrections = data.map(function(ex){return ex.correction;});
    window._exData = data;
    var stars = ['', '⭐', '⭐⭐', '⭐⭐⭐'];
    var html = '<div style="font-family:Poppins,sans-serif;font-size:1em;font-weight:700;color:var(--coral);margin-bottom:18px">✏️ Ejercicios del libro — ' + data.length + ' ejercicios</div>';
    data.forEach(function(ex, i) {
      var dif = ex.difficulte || 1;
      var answerArea = '';
      if (ex.type === 'qcm' && ex.opciones_qcm && ex.opciones_qcm.length > 0) {
        var opts = ex.opciones_qcm;
        var letters = ['A', 'B', 'C', 'D'];
        answerArea = '<div class="ex-qcm-opts" id="exqcm' + i + '">';
        opts.forEach(function(opt, j) {
          answerArea += '<button class="ex-qcm-opt" onclick="answerExQcm(' + i + ',' + j + ',' + ex.correcta_idx + ')">' + letters[j] + '. ' + opt + '</button>';
        });
        answerArea += '</div>';
      } else {
        answerArea = '<input type="text" class="ex-input" id="exi' + i + '" placeholder="Escribe tu respuesta aquí...">';
      }
      html += '<div class="ex-item" id="exitem' + i + '"><div class="ex-header"><span class="ex-num">Ej. ' + ex.numero_ex + '</span><div class="ex-dif">' + stars[dif] + '</div></div><div class="ex-enonce">' + ex.enonce + '</div><div class="ex-answer-area">' + answerArea + '<div class="ex-btns"><button class="btn-correction" onclick="showCorrIdx(' + i + ')">✅ Ver corrección</button><button class="btn-audio-ex" onclick="speakCorrIdx(' + i + ')">🔊 Escuchar</button></div><div class="corr-box" id="corr' + i + '"></div></div></div>';
    });
    panel.innerHTML = html;
  });
}

function answerExQcm(i, chosen, correct) {
  var container = document.getElementById('exqcm' + i);
  if (!container) return;
  var btns = container.querySelectorAll('.ex-qcm-opt');
  btns.forEach(function(btn, j) {
    btn.disabled = true;
    if (j === correct) btn.classList.add('ex-qcm-correct');
    else if (j === chosen) btn.classList.add('ex-qcm-wrong');
  });
  var ok = chosen === correct;
  var corr = (window._corrections || [])[i] || '';
  var box = document.getElementById('corr' + i);
  var retryBtn = !ok ? '<button class="btn-retry-ex" onclick="retryExQcm(' + i + ')">🔄 Reintentar con otra pregunta</button>' : '';
  box.innerHTML = (ok ? '✅ <strong>¡Correcto!</strong> ' : '❌ <strong>Incorrecto.</strong> ') + corr + (retryBtn ? '<br><br>' + retryBtn : '');
  box.classList.add('show');
  speak(ok ? '¡Correcto! ' + corr : 'Incorrecto. ' + corr, null);
}

function retryExQcm(i) {
  var allData = window._exData || [];
  if (!allData.length) return;
  // Choisir un exercice aléatoire différent de l'actuel
  var pool = allData.filter(function(_, idx) { return idx !== i; });
  if (!pool.length) pool = allData;
  var pick = pool[Math.floor(Math.random() * pool.length)];
  var pickIdx = allData.indexOf(pick);
  // Scroll vers l'exercice choisi et le mettre en surbrillance
  var item = document.getElementById('exitem' + pickIdx);
  if (!item) return;
  // Réinitialiser cet exercice
  var container = document.getElementById('exqcm' + pickIdx);
  if (container) {
    var btns = container.querySelectorAll('.ex-qcm-opt');
    btns.forEach(function(btn) {
      btn.disabled = false;
      btn.classList.remove('ex-qcm-correct', 'ex-qcm-wrong');
    });
  }
  var box = document.getElementById('corr' + pickIdx);
  if (box) { box.innerHTML = ''; box.classList.remove('show'); }
  item.classList.add('ex-highlight');
  setTimeout(function(){ item.classList.remove('ex-highlight'); }, 1500);
  item.scrollIntoView({ behavior: 'smooth', block: 'center' });
  speak('Intenta esta pregunta.', null);
}

function showCorrIdx(i) {
  var corr = (window._corrections || [])[i] || '';
  var box = document.getElementById('corr' + i);
  box.innerHTML = '📝 <strong>Corrección:</strong> ' + corr;
  box.classList.add('show');
  speak(corr, null);
}

function speakCorrIdx(i) {
  var corr = (window._corrections || [])[i] || '';
  var box = document.getElementById('corr' + i);
  box.innerHTML = '📝 <strong>Corrección:</strong> ' + corr;
  box.classList.add('show');
  speak('La corrección es: ' + corr, null);
}

// ===== MODULE JUGAR =====
function renderJugar() {
  var panel = document.getElementById('mp-jugar');
  // Collect cards: support both {f,b} and {pregunta,respuesta} formats
  var fc = curLesson.flashcards || [];
  var cards = fc.map(function(c) {
    return { q: c.pregunta || c.f || '', a: c.respuesta || c.b || '' };
  }).filter(function(c) { return c.q && c.a; });

  if (cards.length < 3) {
    panel.innerHTML = '<div style="text-align:center;padding:60px;color:#4060a0">🎮 El profesor aún no ha añadido suficientes tarjetas para jugar.</div>';
    return;
  }

  panel.innerHTML =
    '<div class="jugar-menu" id="jugar-menu">' +
      '<div class="jugar-menu-title">🎮 Elige tu modo de juego</div>' +
      '<div class="jugar-mode-grid">' +
        '<button class="jugar-mode-btn" onclick="startJugarMillonario()">' +
          '<span class="jugar-mode-icon">🏆</span>' +
          '<div class="jugar-mode-name">¿Quién quiere ser millonario?</div>' +
          '<div class="jugar-mode-desc">4 respuestas, 20s por pregunta, 10 preguntas</div>' +
        '</button>' +
        '<button class="jugar-mode-btn" onclick="startJugarCartas()">' +
          '<span class="jugar-mode-icon">🃏</span>' +
          '<div class="jugar-mode-name">Cartas mágicas</div>' +
          '<div class="jugar-mode-desc">10 cartas a revelar, 30s por carta</div>' +
        '</button>' +
      '</div>' +
      '<div style="font-size:.78em;color:#3a5070;text-align:center">' + cards.length + ' tarjetas disponibles en esta lección</div>' +
    '</div>' +
    '<div class="jugar-game" id="jugar-game-mill"><button class="jugar-game-back" onclick="jugarBack()">← Volver</button><div class="mill-wrap" id="mill-content"></div></div>' +
    '<div class="jugar-game" id="jugar-game-cartas"><button class="jugar-game-back" onclick="jugarBack()">← Volver</button><div class="cartas-wrap" id="cartas-content"></div></div>';
}

function jugarBack() {
  document.getElementById('jugar-menu').style.display = '';
  document.getElementById('jugar-game-mill').classList.remove('active');
  document.getElementById('jugar-game-cartas').classList.remove('active');
  clearInterval(window._jugarTimer);
}

// --- helpers ---
function jugarGetCards() {
  var fc = curLesson.flashcards || [];
  return fc.map(function(c) {
    return { q: c.pregunta || c.f || '', a: c.respuesta || c.b || '' };
  }).filter(function(c) { return c.q && c.a; });
}

function jugarShuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

// ===== MILLONARIO =====
function startJugarMillonario() {
  document.getElementById('jugar-menu').style.display = 'none';
  var g = document.getElementById('jugar-game-mill');
  g.classList.add('active');
  var all = jugarShuffle(jugarGetCards());
  var qs = all.slice(0, Math.min(10, all.length));
  window._mill = { qs: qs, idx: 0, score: 0, total: qs.length, answered: false };
  millRender();
}

function millRender() {
  var m = window._mill;
  if (m.idx >= m.total) { millEnd(); return; }
  var q = m.qs[m.idx];
  var all = jugarGetCards();
  // Build distractors: other cards' answers
  var others = all.filter(function(c) { return c.a !== q.a; });
  var shuffled = jugarShuffle(others).slice(0, 3).map(function(c) { return c.a; });
  var opts = jugarShuffle([q.a].concat(shuffled));
  var correctIdx = opts.indexOf(q.a);
  m.curCorrect = correctIdx;
  m.answered = false;
  var letters = ['A', 'B', 'C', 'D'];
  var optsHtml = '';
  opts.forEach(function(o, i) {
    optsHtml += '<button class="mill-opt" id="mill-opt-' + i + '" onclick="millAnswer(' + i + ')">' +
      '<span class="mill-opt-letter">' + letters[i] + '</span>' + o + '</button>';
  });
  var el = document.getElementById('mill-content');
  el.innerHTML =
    '<div class="mill-bar">' +
      '<span class="mill-score">⭐ ' + m.score + ' / ' + m.total + '</span>' +
      '<span style="flex:1"></span>' +
      '<span class="mill-timer" id="mill-timer">20</span>' +
    '</div>' +
    '<div style="font-size:.75em;color:#4060a0;margin-bottom:8px">Pregunta ' + (m.idx+1) + ' de ' + m.total + '</div>' +
    '<div class="mill-q">' + q.q + '</div>' +
    '<div class="mill-opts">' + optsHtml + '</div>' +
    '<div class="mill-feedback" id="mill-feedback"></div>' +
    '<button class="mill-next" id="mill-next" onclick="millNext()">Siguiente →</button>';
  millStartTimer(20);
}

function millStartTimer(s) {
  clearInterval(window._jugarTimer);
  var el = document.getElementById('mill-timer');
  if (!el) return;
  el.textContent = s;
  el.classList.remove('warn');
  window._jugarTimer = setInterval(function() {
    s--;
    var el2 = document.getElementById('mill-timer');
    if (!el2) { clearInterval(window._jugarTimer); return; }
    el2.textContent = s;
    if (s <= 5) el2.classList.add('warn');
    if (s <= 0) { clearInterval(window._jugarTimer); if (!window._mill.answered) millTimeout(); }
  }, 1000);
}

function millTimeout() {
  var m = window._mill;
  m.answered = true;
  var fb = document.getElementById('mill-feedback');
  if (fb) fb.innerHTML = '⏰ ¡Tiempo! La respuesta era: <strong>' + m.qs[m.idx].a + '</strong>';
  var opt = document.getElementById('mill-opt-' + m.curCorrect);
  if (opt) opt.classList.add('correct');
  document.querySelectorAll('.mill-opt').forEach(function(b) { b.disabled = true; });
  var nx = document.getElementById('mill-next');
  if (nx) nx.style.display = 'inline-block';
}

function millAnswer(i) {
  var m = window._mill;
  if (m.answered) return;
  m.answered = true;
  clearInterval(window._jugarTimer);
  var ok = i === m.curCorrect;
  if (ok) m.score++;
  document.querySelectorAll('.mill-opt').forEach(function(b, j) {
    b.disabled = true;
    if (j === m.curCorrect) b.classList.add('correct');
    else if (j === i && !ok) b.classList.add('wrong');
  });
  var fb = document.getElementById('mill-feedback');
  if (fb) fb.innerHTML = ok ? '✅ ¡Correcto!' : '❌ Incorrecto. Era: <strong>' + m.qs[m.idx].a + '</strong>';
  var nx = document.getElementById('mill-next');
  if (nx) nx.style.display = 'inline-block';
}

function millNext() {
  window._mill.idx++;
  millRender();
}

function millEnd() {
  clearInterval(window._jugarTimer);
  var m = window._mill;
  var pct = Math.round(m.score / m.total * 100);
  var emoji = pct >= 80 ? '🏆' : pct >= 50 ? '👍' : '💪';
  document.getElementById('mill-content').innerHTML =
    '<div class="mill-end">' +
      '<div style="font-size:3em;margin-bottom:12px">' + emoji + '</div>' +
      '<div class="mill-end-score">' + m.score + ' / ' + m.total + '</div>' +
      '<div style="color:#5070a0;font-size:.88em;margin:8px 0 24px">' + pct + '% de respuestas correctas</div>' +
      '<button class="mill-next" style="display:inline-block" onclick="startJugarMillonario()">🔄 Jugar de nuevo</button>' +
    '</div>';
}

// ===== CARTAS =====
function startJugarCartas() {
  document.getElementById('jugar-menu').style.display = 'none';
  var g = document.getElementById('jugar-game-cartas');
  g.classList.add('active');
  var all = jugarShuffle(jugarGetCards());
  var qs = all.slice(0, Math.min(10, all.length));
  window._cartas = { qs: qs, cur: -1, known: 0, total: qs.length, revealed: false };
  cartasRender();
}

function cartasRender() {
  var m = window._cartas;
  var gridHtml = '';
  for (var i = 0; i < m.total; i++) {
    var done = m.qs[i]._done;
    var active = i === m.cur;
    gridHtml += '<button class="carta' + (done ? ' done' : '') + (active ? ' active-carta' : '') +
      '" id="carta-' + i + '" onclick="cartaSelect(' + i + ')">' +
      (done ? '✓' : '<span class="carta-num">' + (i+1) + '</span>') + '</button>';
  }
  var known = m.qs.filter(function(q) { return q._done === 'known'; }).length;
  var doneCount = m.qs.filter(function(q) { return q._done; }).length;
  var qHtml = m.cur >= 0 ? m.qs[m.cur].q : '← Elige una carta para empezar';
  var aHtml = m.cur >= 0 ? m.qs[m.cur].a : '';
  var revealed = m.revealed;
  var content = document.getElementById('cartas-content');
  content.innerHTML =
    '<div class="cartas-bar">' +
      '<span class="cartas-prog">✅ ' + known + ' conocidas · ' + (m.total - doneCount) + ' restantes</span>' +
      '<span style="flex:1"></span>' +
      (m.cur >= 0 && !m.qs[m.cur]._done ? '<span class="cartas-timer' + (window._cartasTime <= 5 ? ' warn' : '') + '" id="cartas-timer">30</span>' : '') +
    '</div>' +
    '<div class="cartas-grid">' + gridHtml + '</div>' +
    '<div class="cartas-question" id="cartas-q">' + qHtml + '</div>' +
    (m.cur >= 0 && !m.qs[m.cur]._done ?
      '<div class="cartas-answer-reveal' + (revealed ? ' show' : '') + '" id="cartas-ans">' + aHtml + '</div>' +
      '<div class="cartas-btns">' +
        (!revealed ? '<button class="cartas-reveal-btn" onclick="cartasReveal()">👁 Ver respuesta</button>' :
          '<button class="btn-carta-known" onclick="cartasDone(true)">✅ Lo sabía</button>' +
          '<button class="btn-carta-unknown" onclick="cartasDone(false)">❌ No lo sabía</button>') +
      '</div>' : '') +
    (doneCount >= m.total ?
      '<div class="cartas-end">' +
        '<div style="font-size:3em;margin-bottom:12px">' + (known/m.total >= 0.8 ? '🏆' : '💪') + '</div>' +
        '<div class="cartas-end-score">' + known + ' / ' + m.total + '</div>' +
        '<div style="color:#5070a0;font-size:.88em;margin:8px 0 24px">tarjetas conocidas</div>' +
        '<button class="cartas-reveal-btn" onclick="startJugarCartas()">🔄 Jugar de nuevo</button>' +
      '</div>' : '');
  // Restart timer if new card selected and not done
  if (m.cur >= 0 && !m.qs[m.cur]._done && !revealed) {
    cartasStartTimer();
  }
}

function cartaSelect(i) {
  var m = window._cartas;
  if (m.qs[i]._done) return;
  clearInterval(window._jugarTimer);
  m.cur = i;
  m.revealed = false;
  window._cartasTime = 30;
  cartasRender();
}

function cartasReveal() {
  window._cartas.revealed = true;
  clearInterval(window._jugarTimer);
  var ans = document.getElementById('cartas-ans');
  var btns = document.querySelector('.cartas-btns');
  if (ans) ans.classList.add('show');
  if (btns) btns.innerHTML =
    '<button class="btn-carta-known" onclick="cartasDone(true)">✅ Lo sabía</button>' +
    '<button class="btn-carta-unknown" onclick="cartasDone(false)">❌ No lo sabía</button>';
}

function cartasDone(known) {
  var m = window._cartas;
  if (m.cur < 0) return;
  m.qs[m.cur]._done = known ? 'known' : 'unknown';
  m.cur = -1;
  m.revealed = false;
  clearInterval(window._jugarTimer);
  cartasRender();
}

function cartasStartTimer() {
  clearInterval(window._jugarTimer);
  window._cartasTime = 30;
  window._jugarTimer = setInterval(function() {
    window._cartasTime--;
    var el = document.getElementById('cartas-timer');
    if (!el) { clearInterval(window._jugarTimer); return; }
    el.textContent = window._cartasTime;
    if (window._cartasTime <= 5) el.classList.add('warn');
    if (window._cartasTime <= 0) {
      clearInterval(window._jugarTimer);
      cartasReveal();
    }
  }, 1000);
}
