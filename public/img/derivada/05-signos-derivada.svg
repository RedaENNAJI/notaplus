<svg viewBox="0 0 400 170" xmlns="http://www.w3.org/2000/svg" style="background:#f8faff">
  <line x1="40" y1="145" x2="385" y2="145" stroke="#8099cc" stroke-width="1.5"/>
  <line x1="40" y1="15" x2="40" y2="145" stroke="#8099cc" stroke-width="1.5"/>
  <text x="388" y="149" font-size="11" fill="#5070a0" font-family="Inter,sans-serif">t</text>
  <text x="6" y="22" font-size="10" fill="#5070a0" font-family="Inter,sans-serif">C(t)</text>
  <!-- Courbe -->
  <path d="M40,141 C75,141 105,120 135,62 C150,38 162,22 174,18 C186,14 196,20 212,38 C240,68 278,114 340,136" fill="none" stroke="#4e80ee" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Zone C'>0 -->
  <rect x="41" y="18" width="132" height="126" fill="#22c55e" opacity="0.09" rx="4"/>
  <text x="66" y="88" font-size="11" fill="#22c55e" font-weight="bold" font-family="Inter,sans-serif">C'(t) &gt; 0</text>
  <text x="58" y="103" font-size="9" fill="#22c55e" font-family="Inter,sans-serif">absorción ↑</text>
  <!-- Zone C'<0 -->
  <rect x="175" y="18" width="208" height="126" fill="#ef4444" opacity="0.09" rx="4"/>
  <text x="252" y="88" font-size="11" fill="#ef4444" font-weight="bold" font-family="Inter,sans-serif">C'(t) &lt; 0</text>
  <text x="242" y="103" font-size="9" fill="#ef4444" font-family="Inter,sans-serif">eliminación ↓</text>
  <!-- Cmax point -->
  <circle cx="174" cy="18" r="6" fill="#4e80ee"/>
  <line x1="174" y1="18" x2="174" y2="145" stroke="#4e80ee" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="148" y="10" font-size="9" fill="#4e80ee" font-weight="bold" font-family="Inter,sans-serif">C'(t)=0 → C_max</text>
  <!-- T axis labels -->
  <text x="36" y="158" font-size="9" fill="#8099cc" font-family="Inter,sans-serif">0</text>
  <text x="167" y="158" font-size="9" fill="#4e80ee" font-family="Inter,sans-serif">T_max</text>
</svg>
