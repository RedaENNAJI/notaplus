<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" style="background:#f8faff">
  <line x1="40" y1="170" x2="385" y2="170" stroke="#8099cc" stroke-width="1.5"/>
  <line x1="40" y1="15" x2="40" y2="170" stroke="#8099cc" stroke-width="1.5"/>
  <text x="388" y="174" font-size="11" fill="#5070a0" font-family="Inter,sans-serif">t</text>
  <text x="6" y="22" font-size="10" fill="#5070a0" font-family="Inter,sans-serif">C(t)</text>
  <!-- Courbe atténuée -->
  <path d="M40,166 C75,166 105,145 135,78 C150,50 162,32 174,28 C186,24 196,30 212,48 C240,80 278,128 340,156" fill="none" stroke="#4e80ee" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <!-- Points A et B -->
  <circle cx="92" cy="132" r="5.5" fill="#22c55e"/>
  <circle cx="162" cy="44" r="5.5" fill="#22c55e"/>
  <text x="74" y="150" font-size="10" fill="#22c55e" font-weight="bold" font-family="Inter,sans-serif">A (t₁, C₁)</text>
  <text x="166" y="40" font-size="10" fill="#22c55e" font-weight="bold" font-family="Inter,sans-serif">B (t₂, C₂)</text>
  <!-- Sécante -->
  <line x1="55" y1="170" x2="210" y2="8" stroke="#22c55e" stroke-width="2" stroke-dasharray="5,3"/>
  <!-- Triangle ΔC ΔT -->
  <line x1="92" y1="132" x2="162" y2="132" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="162" y1="132" x2="162" y2="44" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="114" y="146" font-size="11" fill="#ef4444" font-weight="bold" font-family="Inter,sans-serif">Δt</text>
  <text x="166" y="93" font-size="11" fill="#ef4444" font-weight="bold" font-family="Inter,sans-serif">ΔC</text>
  <!-- Formule -->
  <rect x="225" y="68" width="155" height="50" rx="10" fill="white" stroke="#dde3f0" stroke-width="1.2"/>
  <text x="302" y="90" text-anchor="middle" font-size="10" fill="#5070a0" font-family="Inter,sans-serif">Velocidad media =</text>
  <text x="302" y="108" text-anchor="middle" font-size="14" fill="#1a2340" font-weight="bold" font-family="Inter,sans-serif">ΔC / Δt</text>
</svg>
