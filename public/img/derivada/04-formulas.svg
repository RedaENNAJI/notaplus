<svg viewBox="0 0 800 170" xmlns="http://www.w3.org/2000/svg">
  <!-- ===== PANNEAU GAUCHE : C(t) pharma ===== -->
  <rect x="0" y="0" width="395" height="170" fill="#f8faff"/>

  <!-- Axes -->
  <line x1="40" y1="140" x2="250" y2="140" stroke="#8099cc" stroke-width="1.5"/>
  <line x1="40" y1="18" x2="40" y2="140" stroke="#8099cc" stroke-width="1.5"/>
  <text x="252" y="144" font-size="10" fill="#5070a0" font-family="Inter,sans-serif">t</text>
  <text x="6" y="23" font-size="9" fill="#5070a0" font-family="Inter,sans-serif">C(t)</text>

  <!-- Courbe ibu -->
  <path d="M40,136 C65,136 90,120 108,84 C120,62 128,48 137,44 C146,40 154,44 168,58 C186,78 212,110 250,130" fill="none" stroke="#4e80ee" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Point t -->
  <circle cx="108" cy="84" r="4.5" fill="#4e80ee"/>
  <line x1="108" y1="84" x2="108" y2="140" stroke="#4e80ee" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="101" y="153" font-size="9" fill="#4e80ee" font-family="Inter,sans-serif">t</text>

  <!-- Point t+Δt -->
  <circle cx="137" cy="44" r="4.5" fill="#22c55e"/>
  <line x1="137" y1="44" x2="137" y2="140" stroke="#22c55e" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="122" y="153" font-size="9" fill="#22c55e" font-family="Inter,sans-serif">t+Δt</text>

  <!-- Sécante -->
  <line x1="72" y1="116" x2="180" y2="18" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Triangle -->
  <line x1="108" y1="84" x2="137" y2="84" stroke="#888" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="137" y1="84" x2="137" y2="44" stroke="#888" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="115" y="98" font-size="9" fill="#555" font-family="Inter,sans-serif">Δt</text>
  <text x="140" y="68" font-size="9" fill="#555" font-family="Inter,sans-serif">ΔC</text>

  <!-- Boîte formule gauche -->
  <rect x="262" y="22" width="124" height="96" rx="10" fill="white" stroke="#c7d4f0" stroke-width="1.2"/>
  <text x="324" y="40" text-anchor="middle" font-size="9" fill="#5070a0" font-weight="bold" font-family="Inter,sans-serif">Farmacia</text>
  <line x1="269" y1="45" x2="379" y2="45" stroke="#e0e8f8" stroke-width="1"/>
  <text x="324" y="62" text-anchor="middle" font-size="11" fill="#1a2340" font-weight="bold" font-family="Inter,sans-serif">C'(t) =</text>
  <text x="324" y="76" text-anchor="middle" font-size="9" fill="#4e80ee" font-family="Inter,sans-serif">lím  C(t+Δt)−C(t)</text>
  <line x1="296" y1="80" x2="380" y2="80" stroke="#4e80ee" stroke-width="1"/>
  <text x="324" y="93" text-anchor="middle" font-size="9" fill="#4e80ee" font-family="Inter,sans-serif">Δt→0       Δt</text>
  <text x="324" y="110" text-anchor="middle" font-size="8" fill="#22c55e" font-style="italic" font-family="Inter,sans-serif">velocidad instantánea</text>

  <!-- ===== SÉPARATEUR ===== -->
  <line x1="400" y1="10" x2="400" y2="160" stroke="#dde4f0" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ===== PANNEAU DROIT : f(a) général ===== -->
  <rect x="405" y="0" width="395" height="170" fill="#fff8f0"/>

  <!-- Axes -->
  <line x1="445" y1="140" x2="655" y2="140" stroke="#c09060" stroke-width="1.5"/>
  <line x1="445" y1="18" x2="445" y2="140" stroke="#c09060" stroke-width="1.5"/>
  <text x="657" y="144" font-size="10" fill="#a07040" font-family="Inter,sans-serif">x</text>
  <text x="411" y="23" font-size="9" fill="#a07040" font-family="Inter,sans-serif">f(x)</text>

  <!-- Courbe générique -->
  <path d="M445,130 C470,128 494,108 516,78 C530,60 540,50 550,49 C560,48 570,54 586,72 C606,96 632,122 660,132" fill="none" stroke="#e07020" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Point a -->
  <circle cx="516" cy="78" r="4.5" fill="#e07020"/>
  <line x1="516" y1="78" x2="516" y2="140" stroke="#e07020" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="509" y="153" font-size="9" fill="#e07020" font-family="Inter,sans-serif">a</text>

  <!-- Point a+h -->
  <circle cx="550" cy="49" r="4.5" fill="#9333ea"/>
  <line x1="550" y1="49" x2="550" y2="140" stroke="#9333ea" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="536" y="153" font-size="9" fill="#9333ea" font-family="Inter,sans-serif">a+h</text>

  <!-- Sécante -->
  <line x1="479" y1="110" x2="594" y2="24" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Triangle -->
  <line x1="516" y1="78" x2="550" y2="78" stroke="#888" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="550" y1="78" x2="550" y2="49" stroke="#888" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="525" y="92" font-size="9" fill="#555" font-family="Inter,sans-serif">h</text>
  <text x="553" y="67" font-size="9" fill="#555" font-family="Inter,sans-serif">Δf</text>

  <!-- Boîte formule droite -->
  <rect x="668" y="22" width="124" height="96" rx="10" fill="white" stroke="#e0c8a0" stroke-width="1.2"/>
  <text x="730" y="40" text-anchor="middle" font-size="9" fill="#a07040" font-weight="bold" font-family="Inter,sans-serif">General</text>
  <line x1="675" y1="45" x2="785" y2="45" stroke="#f0dfc0" stroke-width="1"/>
  <text x="730" y="62" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="bold" font-family="Inter,sans-serif">f'(a) =</text>
  <text x="730" y="76" text-anchor="middle" font-size="9" fill="#e07020" font-family="Inter,sans-serif">lím  f(a+h)−f(a)</text>
  <line x1="703" y1="80" x2="786" y2="80" stroke="#e07020" stroke-width="1"/>
  <text x="730" y="93" text-anchor="middle" font-size="9" fill="#e07020" font-family="Inter,sans-serif">h→0        h</text>
  <text x="730" y="110" text-anchor="middle" font-size="8" fill="#9333ea" font-style="italic" font-family="Inter,sans-serif">pendiente de la tangente</text>
</svg>
