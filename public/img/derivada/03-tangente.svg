<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" style="background:#f8faff">
  <line x1="40" y1="170" x2="385" y2="170" stroke="#8099cc" stroke-width="1.5"/>
  <line x1="40" y1="15" x2="40" y2="170" stroke="#8099cc" stroke-width="1.5"/>
  <text x="388" y="174" font-size="11" fill="#5070a0" font-family="Inter,sans-serif">t</text>
  <text x="6" y="22" font-size="10" fill="#5070a0" font-family="Inter,sans-serif">C(t)</text>
  <!-- Courbe -->
  <path d="M40,166 C75,166 105,145 135,78 C150,50 162,32 174,28 C186,24 196,30 212,48 C240,80 278,128 340,156" fill="none" stroke="#4e80ee" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Point fixe A -->
  <circle cx="118" cy="102" r="6" fill="#4e80ee"/>
  <text x="104" y="96" font-size="11" fill="#4e80ee" font-weight="bold" font-family="Inter,sans-serif">A</text>
  <!-- Sécantes successives (de moins en moins éloignées) -->
  <line x1="55" y1="152" x2="290" y2="22" stroke="#22c55e" stroke-width="1.1" opacity="0.3" stroke-dasharray="4,3"/>
  <circle cx="218" cy="50" r="3.5" fill="#22c55e" opacity="0.3"/>
  <line x1="62" y1="148" x2="240" y2="38" stroke="#22c55e" stroke-width="1.2" opacity="0.5" stroke-dasharray="4,3"/>
  <circle cx="180" cy="62" r="3.5" fill="#22c55e" opacity="0.5"/>
  <line x1="72" y1="140" x2="210" y2="56" stroke="#22c55e" stroke-width="1.4" opacity="0.7" stroke-dasharray="4,3"/>
  <circle cx="152" cy="80" r="3.5" fill="#22c55e" opacity="0.7"/>
  <!-- Tangente finale -->
  <line x1="58" y1="130" x2="208" y2="66" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <text x="212" y="64" font-size="10" fill="#ef4444" font-weight="bold" font-family="Inter,sans-serif">tangente</text>
