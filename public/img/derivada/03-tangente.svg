  <text x="58" y="112" font-size="9" fill="#22c55e" opacity="0.8" font-family="Inter,sans-serif">sécantes</text>
  <text x="230" y="112" font-size="10" fill="#5070a0" font-family="Inter,sans-serif">Δt → 0</text>
  <text x="226" y="128" font-size="10" fill="#ef4444" font-weight="bold" font-family="Inter,sans-serif">→ C'(t)</text>
</svg>
